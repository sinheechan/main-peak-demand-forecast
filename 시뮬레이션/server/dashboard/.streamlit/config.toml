# 대시보드 테마 (라이트 고정, 스킬 템플릿 dense-dashboard의 라이트 색상 기반)
#   - 색, 여백은 여기서만 설정 (app.py에 CSS 없음)
#   - 차트 색은 app.py 위쪽 색 상수와 같은 값

[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#CBD5E1"
greenColor = "#059669"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#EA580C"
blueColor = "#1D4ED8"
violetColor = "#7C3AED"
grayColor = "#64748B"
chartCategoricalColors = ["#3B82F6", "#DC2626", "#64748B", "#7C3AED", "#059669", "#EA580C"]
dataframeBorderColor = "#CBD5E1"
dataframeHeaderBackgroundColor = "#E2E8F0"
dataframeHeaderTextColor = "#0F172A"
showWidgetBorder = true
baseRadius = "6px"
baseFontSize = 14
headingFontSizes = ["22px", "18px", "15px", "14px", "13px", "12px"]
metricValueFontSize = "26px"
paddingTop = "0.5rem"
paddingBottom = "1rem"
